<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NüA Studio | 前撮り撮影</title>
<meta name="description" content="NüA Studio - 自然光の中で、二人だけの特別な瞬間を丁寧に残す前撮り撮影スタジオ。">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1b19;
  --paper: #ffffff;
  --rose: #b8828a;
  --sage: #8a9182;
  --line-dark: rgba(28, 27, 25, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  color-scheme: light only;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  line-height: 1.9;
  font-size: 9px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.serif { font-family: 'Shippori Mincho', serif; }

/* ---------- Top nav ---------- */
.topnav {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 22px;
  padding: 22px 6vw;
}

.topnav a {
  color: var(--ink);
  text-decoration: none;
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  padding-bottom: 3px;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease, opacity 0.2s ease;
}

.topnav a.active {
  border-color: var(--rose);
}

.topnav a:hover {
  border-color: var(--rose);
}

/* ---------- Hero (HOME page) ---------- */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4vh 6vw 6vh;
}

.hero-image {
  width: 100%;
  max-width: 220px;
  aspect-ratio: 4 / 5;
  border: 1px solid var(--line-dark);
  overflow: hidden;
}

.hero-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-mark {
  text-align: center;
  margin-top: 26px;
}

.hero-mark .studio-name {
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.08em;
}

.hero-mark .location {
  margin-top: 8px;
  font-size: 0.42rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: #8a847a;
}

/* ---------- Body sections ---------- */
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 6vh 7vw;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

section {
  padding: 40px 0;
}

.concept {
  font-family: 'Shippori Mincho', serif;
  font-size: 0.46rem;
  font-weight: 500;
  line-height: 2;
  color: var(--ink);
  text-align: center;
}

.concept-en {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  letter-spacing: 0.02em;
}

.concept .signature {
  display: block;
  margin-top: 1.8em;
}

.contact-block {
  text-align: center;
  padding: 48px 0 40px;
}

.ig-link {
  display: inline-block;
  color: var(--ink);
  text-decoration: none;
  font-size: 0.5rem;
  letter-spacing: 0.05em;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--rose);
  transition: opacity 0.2s ease;
}

.ig-link:hover { opacity: 0.6; }

footer {
  text-align: center;
  padding: 28px 0 36px;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  color: #a8a29a;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>
